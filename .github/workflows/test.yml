name: PostgreSQL Extension Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [13, 14, 15, 16, 17, 18]

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL ${{ matrix.postgres }}
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-${{ matrix.postgres }} postgresql-server-dev-${{ matrix.postgres }}

    - name: Start PostgreSQL
      run: |
        # The runner image ships another PostgreSQL, so this cluster may not use port 5432.
        sudo pg_ctlcluster ${{ matrix.postgres }} main start || true
        pg_lsclusters
        PORT=$(pg_lsclusters -h | awk '$1 == "${{ matrix.postgres }}" {print $3}')
        echo "PGPORT=$PORT" >> "$GITHUB_ENV"
        echo "PGUSER=$(whoami)" >> "$GITHUB_ENV"
        echo "PGHOST=/var/run/postgresql" >> "$GITHUB_ENV"
        sudo -u postgres createuser -p "$PORT" -s "$(whoami)"

    - name: Build and install
      run: |
        export PG_CONFIG=/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
        make PG_CONFIG=$PG_CONFIG
        sudo make PG_CONFIG=$PG_CONFIG install

    - name: Regression tests
      run: |
        export PG_CONFIG=/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
        make PG_CONFIG=$PG_CONFIG installcheck

    - name: Full suite (7000+ cases)
      run: |
        psql -X -d postgres -c 'CREATE EXTENSION IF NOT EXISTS jalali_utils'
        python3 tests/suite.py psql -X -A -t -d postgres | tee suite_summary.txt | grep -e TOTAL -e '^FAIL' -A4 | head -80
        grep -q "TOTAL \([0-9]*\)/\1 passed" suite_summary.txt

    - name: Show regression results on failure
      if: failure()
      run: |
        if [ -f regression.diffs ]; then
          cat regression.diffs
          echo "::error title=regression.diffs::$(head -c 4000 regression.diffs | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
        fi
        pg_lsclusters || true
