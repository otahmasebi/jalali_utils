name: PostgreSQL Extension Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [13, 14, 15, 16, 17, 18]

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL ${{ matrix.postgres }}
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-${{ matrix.postgres }} postgresql-server-dev-${{ matrix.postgres }}

    - name: Start a private PostgreSQL ${{ matrix.postgres }} cluster
      run: |
        # The runner image already runs another PostgreSQL, so start our own cluster on a fixed socket and port.
        BIN=/usr/lib/postgresql/${{ matrix.postgres }}/bin
        "$BIN/initdb" -D "$RUNNER_TEMP/pgdata" -A trust -U "$(whoami)"
        "$BIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p 5439 -k /tmp -c listen_addresses=''" -w -l "$RUNNER_TEMP/pg.log" start
        echo "PGHOST=/tmp" >> "$GITHUB_ENV"
        echo "PGPORT=5439" >> "$GITHUB_ENV"
        echo "PGUSER=$(whoami)" >> "$GITHUB_ENV"
        echo "PGDATABASE=postgres" >> "$GITHUB_ENV"

    - name: Build and install
      run: |
        export PG_CONFIG=/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
        make PG_CONFIG=$PG_CONFIG
        sudo make PG_CONFIG=$PG_CONFIG install

    - name: Regression tests
      run: |
        export PG_CONFIG=/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
        make PG_CONFIG=$PG_CONFIG installcheck

    - name: Full suite (7000+ cases)
      run: |
        psql -X -c 'CREATE EXTENSION IF NOT EXISTS jalali_utils'
        python3 tests/suite.py psql -X -A -t | tee suite_summary.txt | grep -e TOTAL -e '^FAIL' -A4 | head -80
        grep -q "TOTAL \([0-9]*\)/\1 passed" suite_summary.txt

    - name: Show regression results on failure
      if: failure()
      run: |
        if [ -f regression.diffs ]; then
          cat regression.diffs
          echo "::error title=regression.diffs::$(head -c 4000 regression.diffs | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
        fi
        cat "$RUNNER_TEMP/pg.log" || true
