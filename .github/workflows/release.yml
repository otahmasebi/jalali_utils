name: Release

# Push a tag such as v0.0.4 to publish a GitHub release with a source tarball.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check the tag matches the control file
      run: |
        v=$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" jalali_utils.control)
        [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != control version v$v"; exit 1; }

    - name: Build source tarball
      run: |
        v=${GITHUB_REF_NAME#v}
        git archive --format=tar.gz --prefix=jalali_utils-$v/ -o jalali_utils-$v.tar.gz HEAD
        git archive --format=zip --prefix=jalali_utils-$v/ -o jalali_utils-$v.zip HEAD

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          jalali_utils-*.tar.gz
          jalali_utils-*.zip
        generate_release_notes: true
