name: Release

# Push a tag such as v0.0.4 to publish a GitHub release with a source tarball.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check the tag matches the control file
      run: |
        v=$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" jalali_utils.control)
        [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != control version v$v"; exit 1; }

    - name: Build source tarball
      run: |
        v=${GITHUB_REF_NAME#v}
        git archive --format=tar.gz --prefix=jalali_utils-$v/ -o jalali_utils-$v.tar.gz HEAD
        git archive --format=zip --prefix=jalali_utils-$v/ -o jalali_utils-$v.zip HEAD

    - name: Check META.json version
      run: |
        v=${GITHUB_REF_NAME#v}
        [ "$(python3 -c "import json;print(json.load(open('META.json'))['version'])")" = "$v" ] || { echo "META.json version differs from $v"; exit 1; }
        [ "$(python3 -c "import json;print(json.load(open('META.json'))['provides']['jalali_utils']['version'])")" = "$v" ] || { echo "META.json provides version differs from $v"; exit 1; }

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          jalali_utils-*.tar.gz
          jalali_utils-*.zip
        generate_release_notes: true

  pgxn:
    needs: release
    # Runs only when the PGXN_USERNAME and PGXN_PASSWORD repository secrets exist (skipped otherwise).
    if: ${{ vars.PUBLISH_TO_PGXN == 'true' }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    env:
      PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
      PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - name: Bundle and release on PGXN
      run: pgxn-bundle && pgxn-release
